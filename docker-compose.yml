services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fintech_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=database
      - DB_PORT=3306
      - DB_DATABASE=fintech_correspondents
      - DB_USERNAME=fintech_user
      - DB_PASSWORD=fintech_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LARAVEL_WEBSOCKETS_HOST=websockets
      - LARAVEL_WEBSOCKETS_PORT=6001
    volumes:
      - .:/var/www/html
    networks:
      - fintech_network
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: nginx:1.25-alpine
    container_name: fintech_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - fintech_network
    depends_on:
      - app
      - websockets

  database:
    image: mysql:8.0
    container_name: fintech_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: fintech_correspondents
      MYSQL_USER: fintech_user
      MYSQL_PASSWORD: fintech_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
    networks:
      - fintech_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "fintech_user", "-pfintech_secret"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.0-alpine
    container_name: fintech_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fintech_network

  websockets:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fintech_websockets
    restart: unless-stopped
    command: php artisan websockets:serve --port=6001
    working_dir: /var/www/html
    environment:
      - APP_ENV=local
      - DB_HOST=database
      - DB_PORT=3306
      - DB_DATABASE=fintech_correspondents
      - DB_USERNAME=fintech_user
      - DB_PASSWORD=fintech_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LARAVEL_WEBSOCKETS_HOST=0.0.0.0
      - LARAVEL_WEBSOCKETS_PORT=6001
    ports:
      - "6001:6001"
    volumes:
      - .:/var/www/html
    networks:
      - fintech_network
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started

  mailpit:
    image: axllent/mailpit:latest
    container_name: fintech_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - fintech_network

networks:
  fintech_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
