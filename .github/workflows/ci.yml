name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  php-lint:
    name: PHP Syntax & Lint (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, zip
          coverage: none

      - name: Validate Composer Configuration
        run: composer validate --no-check-all --no-check-lock

      - name: Syntax Linting (app, routes, config)
        run: |
          echo "Linting routes..."
          php -l routes/api.php
          php -l routes/web.php
          php -l routes/console.php
          php -l routes/channels.php
          
          echo "Linting config files..."
          find config -name "*.php" -exec php -l {} \;
          
          echo "Linting application classes..."
          find app -name "*.php" -exec php -l {} \;

  database-validation:
    name: Database Schema & Seeds Verification (MySQL 8.0)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_secret_password
          MYSQL_DATABASE: fintech_correspondents
          MYSQL_USER: fintech_user
          MYSQL_PASSWORD: fintech_secret
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Wait for MySQL
        run: |
          while ! mysqladmin ping -h 127.0.0.1 -u root -proot_secret_password --silent; do
            echo "Waiting for MySQL to be ready..."
            sleep 2
          done

      - name: Apply Database DDL Schema
        run: |
          echo "Importing database/schema.sql..."
          mysql -h 127.0.0.1 -u fintech_user -pfintech_secret fintech_correspondents < database/schema.sql
          echo "Schema import successful!"

      - name: Apply Database Seeds
        run: |
          echo "Importing database/seeds.sql..."
          mysql -h 127.0.0.1 -u fintech_user -pfintech_secret fintech_correspondents < database/seeds.sql
          echo "Seeds import successful!"

      - name: Verify Seed Integrity & Record Counts
        run: |
          mysql -h 127.0.0.1 -u fintech_user -pfintech_secret fintech_correspondents -e "
            SELECT 'Products count' AS metric, COUNT(*) AS count FROM products;
            SELECT 'Users count' AS metric, COUNT(*) AS count FROM users;
            SELECT 'Transactions count' AS metric, COUNT(*) AS count FROM transactions;
            SELECT 'Balances count' AS metric, COUNT(*) AS count FROM balances;
            SELECT 'Permissions count' AS metric, COUNT(*) AS count FROM permissions;
            SELECT 'Roles count' AS metric, COUNT(*) AS count FROM roles;
          "
          
          # Assert minimum record thresholds
          PROD_COUNT=$(mysql -h 127.0.0.1 -u fintech_user -pfintech_secret -N -s fintech_correspondents -e "SELECT COUNT(*) FROM products;")
          USER_COUNT=$(mysql -h 127.0.0.1 -u fintech_user -pfintech_secret -N -s fintech_correspondents -e "SELECT COUNT(*) FROM users;")
          TX_COUNT=$(mysql -h 127.0.0.1 -u fintech_user -pfintech_secret -N -s fintech_correspondents -e "SELECT COUNT(*) FROM transactions;")
          
          if [ "$PROD_COUNT" -lt 10 ]; then
            echo "ERROR: Expected at least 10 products, found $PROD_COUNT"
            exit 1
          fi
          
          if [ "$USER_COUNT" -lt 9 ]; then
            echo "ERROR: Expected at least 9 users, found $USER_COUNT"
            exit 1
          fi
          
          if [ "$TX_COUNT" -lt 9 ]; then
            echo "ERROR: Expected at least 9 transactions, found $TX_COUNT"
            exit 1
          fi
          
          echo "All database verification assertions passed successfully!"

  docker-validation:
    name: Docker Compose Specification Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: docker compose config
