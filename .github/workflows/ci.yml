name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pint y pruebas (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fintech_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: fintech_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_DRIVER: array

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, zip, gd, sockets
          coverage: none

      - run: composer validate --strict --no-check-lock

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: vendor/bin/pint --test

      - name: Preparar entorno, migraciones y Passport
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan passport:keys --force
          php artisan passport:client --personal --name=ci --no-interaction

      - run: vendor/bin/phpunit

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker compose config --quiet

      - run: docker build -f docker/php/Dockerfile -t fintech-correspondent-banking .

      - name: Verificar PHP y extensiones de la imagen
        run: docker run --rm fintech-correspondent-banking php -m | grep -E '^(pdo_mysql|redis|bcmath|gd|intl)$'
